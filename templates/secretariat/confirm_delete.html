{% extends 'secretariat/base_secretariat.html' %}

{% block title %}Confirmer la suppression{% endblock %}

{% block secr_content %}
<div class="card mt-3">
    <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
        <h4 class="mt-3">Confirmer la suppression</h4>
        <p class="text-muted">Voulez-vous vraiment supprimer <strong>{{ objet }}</strong> ? Cette action est irréversible.</p>
        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Supprimer</button>
            <a href="{% url retour %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
