{% load static %}
<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Système de gestion | Fastlane Logistic</title>

    

    <!-- SEO Meta Tags -->

    <meta name="description" content="GuinéeRH - Logiciel de gestion des ressources humaines conforme au Code du Travail Guinéen. Paie, CNSS, congés, contrats. Solution RH complète pour entreprises en Guinée.">

    <meta name="keywords" content="logiciel RH Guinée, gestion paie Guinée, CNSS Guinée, ressources humaines Conakry, logiciel paie guinéen, gestion employés Guinée, bulletin de paie Guinée, calcul salaire Guinée">

    <meta name="author" content="GuinéeRH">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://www.guineerh.space/login/">

    

    <!-- Open Graph / Facebook -->

    <meta property="og:type" content="website">

    <meta property="og:url" content="https://www.guineerh.space/">

    <meta property="og:title" content="GuinéeRH - Logiciel de Gestion RH pour la Guinée">

    <meta property="og:description" content="Solution complète de gestion des ressources humaines conforme au Code du Travail Guinéen. Paie, CNSS, congés, contrats et plus.">

    <meta property="og:image" content="https://www.guineerh.space/static/img/og-image.png">

    <meta property="og:locale" content="fr_GN">

    <meta property="og:site_name" content="GuinéeRH">

    

    <!-- Twitter Card -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="GuinéeRH - Logiciel de Gestion RH pour la Guinée">

    <meta name="twitter:description" content="Solution complète de gestion des ressources humaines conforme au Code du Travail Guinéen.">

    <meta name="twitter:image" content="https://www.guineerh.space/static/img/og-image.png">

    

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="/static/img/favicon.png">

    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">

    

    <!-- Structured Data / JSON-LD -->

    <script type="application/ld+json">

    {

        "@context": "https://schema.org",

        "@type": "SoftwareApplication",

        "name": "GuinéeRH",

        "description": "Logiciel de gestion des ressources humaines conforme au Code du Travail Guinéen",

        "applicationCategory": "BusinessApplication",

        "operatingSystem": "Web",

        "offers": {

            "@type": "Offer",

            "price": "0",

            "priceCurrency": "GNF"

        },

        "provider": {

            "@type": "Organization",

            "name": "GuinéeRH",

            "url": "https://www.guineerh.space",

            "address": {

                "@type": "PostalAddress",

                "addressCountry": "GN",

                "addressLocality": "Conakry"

            }

        },

        "featureList": [

            "Gestion de la paie conforme CNSS",

            "Calcul automatique RTS",

            "Gestion des congés",

            "Suivi des contrats",

            "Déclarations CNSS",

            "Gestion des expatriés"

        ]

    }

    </script>

    

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">

    <style>
        :root { --o-brand: #714b67; --o-brand-dark: #5b3c52; --o-border: #d8dadd; }
        body {
            font-family: "Roboto", -apple-system, "Segoe UI", "Noto Sans", Arial, sans-serif;
            font-size: 0.9rem;
            background: linear-gradient(160deg, #714b67 0%, #5a3a52 55%, #44293e 100%) fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 24px 0;
        }
        .login-container { max-width: 420px; margin: 0 auto; width: 100%; }
        .login-card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, .35);
            overflow: hidden;
        }
        .login-header { background: #fff; color: #212529; padding: 30px 30px 6px; text-align: center; }
        .login-header .login-logo {
            width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 12px;
            background: linear-gradient(145deg, #8b6482, #714b67);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(113, 75, 103, .35);
        }
        .login-header .login-logo i { font-size: 1.9rem; color: #fff; margin: 0; }
        .login-header h3 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; color: #212529; }
        .login-header p { color: #6b7280; font-size: .85rem; }
        .login-body { padding: 22px 34px 34px; }
        .form-label { font-weight: 500; color: #212529; margin-bottom: 2px; font-size: .85rem; }
        .form-label i { color: var(--o-brand); width: 16px; }
        .form-control {
            border: 0; border-bottom: 1px solid var(--o-border); border-radius: 0;
            padding: 6px 2px; background: transparent; box-shadow: none;
        }
        .form-control:hover { border-bottom-color: #9aa0a6; }
        .form-control:focus { border-color: var(--o-brand); box-shadow: 0 1px 0 var(--o-brand); background: #fff; }
        .form-check-input:checked { background-color: var(--o-brand); border-color: var(--o-brand); }
        .form-check-input:focus { border-color: #8b6482; box-shadow: 0 0 0 .15rem rgba(113, 75, 103, .25); }
        .btn-login {
            background: var(--o-brand); border: 1px solid var(--o-brand); color: #fff;
            padding: 9px; font-weight: 500; border-radius: 4px; margin-top: 6px;
        }
        .btn-login:hover, .btn-login:focus, .btn-login:active {
            background: var(--o-brand-dark) !important; border-color: var(--o-brand-dark) !important; color: #fff !important;
            transform: none; box-shadow: none;
        }
        .login-body a { color: #017e84; }
        .guinea-flag {
            display: inline-block; width: 26px; height: 17px;
            background: linear-gradient(to right, #CE1126 33.33%, #FCD116 33.33%, #FCD116 66.66%, #009460 66.66%);
            border-radius: 3px; margin-left: 8px; vertical-align: middle;
        }
        .alert { border-radius: 4px; font-size: .85rem; }
        /* Odoo 18 : fond clair à points, carte compacte, champs encadrés */
        body {
            background-color: #f8f9fa;
            background-image: radial-gradient(circle, rgba(0, 0, 0, .09) 1px, transparent 1.4px), radial-gradient(ellipse at 50% 35%, #fff, rgba(248, 249, 250, 0) 70%);
            background-size: 18px 18px, 100% 100%;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, "Noto Sans", Arial, sans-serif;
            font-size: .875rem;
        }
        .login-container { max-width: 360px; }
        .login-card { border: 1px solid #e9ecef; border-radius: 8px; box-shadow: 0 2px 14px rgba(0, 0, 0, .06); }
        .login-header { padding: 28px 24px 4px; }
        .login-header .login-logo { width: 56px; height: 56px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.04); }
        .login-header .login-logo i { color: #714b67; font-size: 1.7rem; }
        .login-body { padding: 18px 24px 24px; }
        .form-control { border: 1px solid #dee2e6; border-radius: 6px; padding: 6px 10px; background: #fff; min-height: 34px; }
        .form-control:hover { border-color: #ced4da; }
        .form-control:focus { border-color: #017e84; box-shadow: 0 0 0 .15rem rgba(1, 126, 132, .15); }
        .btn-login { border-radius: 6px; padding: 7px; }
    </style>

</head>

<body>

    <div class="container">

        <div class="login-container">

            {% include 'partials/messages.html' %}

            

            <div class="login-card">

                <div class="login-header">

                    <div class="login-logo"><i class="fas fa-users-cog"></i></div>

                    <h3>Système de gestion</h3>

                    <p class="mb-0">Fastlane Logistic</p>

                </div>

                

                <div class="login-body">

                    <form method="post">

                        {% csrf_token %}

                        

                        <div class="mb-3">

                            <label for="username" class="form-label">

                                <i class="fas fa-user"></i> Nom d'utilisateur

                            </label>

                            <input type="text" class="form-control" id="username" name="username" required autofocus>

                        </div>

                        

                        <div class="mb-3">

                            <label for="password" class="form-label">

                                <i class="fas fa-lock"></i> Mot de passe

                            </label>

                            <input type="password" class="form-control" id="password" name="password" required>

                        </div>

                        

                        <div class="mb-3 form-check">

                            <input type="checkbox" class="form-check-input" id="remember">

                            <label class="form-check-label" for="remember">

                                Se souvenir de moi

                            </label>

                        </div>

                        

                        <button type="submit" class="btn btn-primary btn-login w-100">

                            <i class="fas fa-sign-in-alt"></i> Se connecter

                        </button>

                        

                        <div class="text-center mt-3">

                            <a href="#" class="text-muted small">

                                <i class="fas fa-question-circle"></i> Mot de passe oublié ?

                            </a>

                        </div>

                    </form>

                </div>

            </div>

            

            <div class="text-center mt-4">

                <a href="{% url 'core:register_entreprise' %}" class="btn btn-outline-dark">

                    <i class="fas fa-building"></i> Créer un compte entreprise

                </a>

            </div>

            

            <div class="text-center mt-3">

                <a href="{% url 'core:documentation_legale' %}" class="btn btn-outline-secondary btn-sm">

                    <i class="fas fa-book"></i> Documentation légale paie

                </a>

            </div>

            

            <div class="text-center mt-3 text-muted">

                <small>

                    <i class="fas fa-shield-alt"></i> Système sécurisé - Conforme au Code du Travail Guinéen

                </small>

            </div>

        </div>

    </div>

    

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>

</html>
