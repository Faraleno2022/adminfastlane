{% extends 'stock/base_stock.html' %}

{% block title %}{{ titre }}{% endblock %}

{% block stock_content %}
<div class="card mt-3">
    <div class="card-body text-center py-5">
        <i class="bi bi-clipboard-check text-success" style="font-size: 3rem;"></i>
        <h4 class="mt-3">{{ titre }}</h4>
        <p class="text-muted">{{ message }}</p>
        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>{{ bouton }}</button>
            <a href="{% url retour retour_pk %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
